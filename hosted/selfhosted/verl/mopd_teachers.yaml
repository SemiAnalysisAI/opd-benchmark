# verl-tinker server for MOPD: the actor_rollout.yaml actor and colocated rollout on two nodes, and one dedicated
# frozen vLLM teacher pool per domain on the other two (two TP4 replicas each). verl-tinker teachers load full
# models, so each is an SFT teacher merged into the base model by merge_teacher.py, under $TINKER_TEACHERS_DIR.
# Clients reach a teacher by its model_name: teachers.json holds base:caesar_cipher-teacher and
# base:simple_geometry-teacher, which the Verl backend turns into create_sampling_client(base_model=...).
server:
  model_name: ${oc.env:TINKER_SERVER_MODEL_NAME,Qwen/Qwen3.6-35B-A3B}
  host: ${oc.env:TINKER_SERVER_HOST,0.0.0.0}
  port: ${oc.env:TINKER_SERVER_PORT,8000}
  ray_address: ${oc.env:RAY_ADDRESS,local}
  checkpoint_dir: ${oc.env:TINKER_CHECKPOINT_DIR,/tmp/tinker-checkpoints}
  server_max_runtime: null
  max_concurrent_samples: ${oc.env:TINKER_SERVER_MAX_CONCURRENT_SAMPLES,512}
  enable_offload: true
  auto_merge_verl_default_config: true

actor_rollout_ref:
  actor:
    strategy: fsdp
    use_kl_loss: false  # Tinker folds any KL into client-side advantages.
    entropy_coeff: 0
    ppo_mini_batch_size: 32
    use_dynamic_bsz: true
    ppo_max_token_len_per_gpu: 32768
    ppo_micro_batch_size_per_gpu: 1
    fsdp_config:
      model_dtype: bfloat16
      param_offload: false
      optimizer_offload: false
      use_orig_params: true  # PEFT adapter export needs the original parameter views (see the template).
    optim:
      lr_scheduler_type: constant
      lr: 1.0e-05
      weight_decay: 0.0
  rollout:
    name: vllm
    mode: async
    tensor_model_parallel_size: 4
    pipeline_model_parallel_size: 1
    gpu_memory_utilization: 0.7
    prompt_length: 2048
    response_length: 30720
    max_num_seqs: 256
    max_num_batched_tokens: 32768
    enable_chunked_prefill: true
    calculate_log_probs: true
    log_prob_use_dynamic_bsz: true
    log_prob_max_token_len_per_gpu: 32768
    log_prob_micro_batch_size_per_gpu: 1
    free_cache_engine: true
    enforce_eager: false
    load_format: safetensors
    engine_kwargs:
      vllm:
        disable_custom_all_reduce: true
    layered_summon: false
    checkpoint_engine:
      update_weights_bucket_megabytes: 4096
  ref:
    enable: false
  model:
    path: ${oc.env:TINKER_SERVER_MODEL_PATH,Qwen/Qwen3.6-35B-A3B}
    use_remove_padding: true
    enable_gradient_checkpointing: true
    trust_remote_code: true
    lora_rank: 64
    lora_alpha: 32
    target_modules: all-linear
    lora_adapter_path: null

distillation:
  enabled: true
  nnodes: 2
  n_gpus_per_node: 8
  dedicated_resource_pools: true
  teacher_models:
    caesar_cipher_teacher:
      key: caesar_cipher
      model_name: caesar_cipher-teacher
      model_path: ${oc.env:TINKER_TEACHERS_DIR}/caesar_cipher
      num_replicas: 2
      inference:
        name: vllm
        tensor_model_parallel_size: 4
        data_parallel_size: 1
        pipeline_model_parallel_size: 1
        gpu_memory_utilization: 0.8
        prompt_length: 2048
        response_length: 30720
        max_model_len: 32768
        max_num_seqs: 256
        max_num_batched_tokens: 32768
        enable_chunked_prefill: true
        enable_prefix_caching: true
        engine_kwargs:
          vllm:
            disable_custom_all_reduce: true
    simple_geometry_teacher:
      key: simple_geometry
      model_name: simple_geometry-teacher
      model_path: ${oc.env:TINKER_TEACHERS_DIR}/simple_geometry
      num_replicas: 2
      inference:
        name: vllm
        tensor_model_parallel_size: 4
        data_parallel_size: 1
        pipeline_model_parallel_size: 1
        gpu_memory_utilization: 0.8
        prompt_length: 2048
        response_length: 30720
        max_model_len: 32768
        max_num_seqs: 256
        max_num_batched_tokens: 32768
        enable_chunked_prefill: true
        enable_prefix_caching: true
        engine_kwargs:
          vllm:
            disable_custom_all_reduce: true

trainer:
  logger:
  - console
  project_name: verl_tinker_server
  experiment_name: qwen3_6_35b_a3b_lora
  nnodes: 2
  n_gpus_per_node: 8
