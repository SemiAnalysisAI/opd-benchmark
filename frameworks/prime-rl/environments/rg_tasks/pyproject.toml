[project]
name = "rg-tasks"
version = "0.1.0"
description = "The OPD reasoning_gym tasks as a verifiers v1 taskset, scored by the shared verifier."
requires-python = ">=3.11"
dependencies = ["verifiers", "reasoning-gym==0.1.25"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rg_tasks"]
