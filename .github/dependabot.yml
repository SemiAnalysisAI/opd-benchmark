version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/frameworks/tinker"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: "pip"
    directory: "/frameworks/prime-rl/campaign/environments/mopd_puzzles"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
