    id: ???
    num: ???
    config_name: ppo_trainer
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.4
    version_base: '1.3'
    cwd: /workspace/verl
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /workspace/verl/verl/trainer/config
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: /dev/shm/opd-bench/runs-full/verl-smoke2/hydra
    choices:
      transfer_queue: transfer_queue
      distillation: distillation
      algorithm@algorithm.rollout_correction: rollout_correction
      reward: reward
      model@critic.model: hf_model
      model@actor_rollout_ref.model: hf_model
      rollout@actor_rollout_ref.rollout: rollout
      data: legacy_data
      model_engine: dp
      critic: dp_critic
      critic/../engine@critic.fsdp: fsdp
      critic/../optim@critic.optim: fsdp
      ref@actor_rollout_ref.ref: dp_ref
      ref/../engine@actor_rollout_ref.ref.fsdp_config: fsdp
