max_steps = 15
seq_len = 17408

[deployment]
num_train_gpus = 2
num_infer_gpus = 4

[model]
name = "/dev/shm/opd-bench/models-full/student"

[file_monitor]

[orchestrator]
batch_size = 64
group_size = 4

[orchestrator.algo]
type = "grpo"

[orchestrator.renderer]
name = "default"

# Pure OPD intentionally has zero task reward. Prime-RL's default enforced
# post-batch zero-advantage filter would otherwise discard every trajectory
# before the OPD trainer can consume the teacher log probabilities.
[[orchestrator.pre_batch_filters]]
type = "gibberish"
enforce = false

[[orchestrator.pre_batch_filters]]
type = "repetition"
enforce = false

[[orchestrator.pre_batch_filters]]
type = "zero_advantage"
enforce = false

[[orchestrator.post_batch_filters]]
type = "gibberish"
enforce = false

[[orchestrator.post_batch_filters]]
type = "repetition"
enforce = false

[[orchestrator.post_batch_filters]]
type = "zero_advantage"
enforce = false

[orchestrator.train.sampling]
temperature = 1.0
max_completion_tokens = 16384

[[orchestrator.train.source]]
name = "math"
ratio = 1.0

[orchestrator.train.source.env.taskset]
id = "mopd-prompts-v1"
data_path = "/dev/shm/opd-bench/data-full/prime_math_train.jsonl"

[orchestrator.train.source.env.agent.harness]
id = "null"

[orchestrator.train.source.env.agent.runtime]
type = "subprocess"

[orchestrator.train.source.algo]
type = "opd"

[orchestrator.train.source.algo.teacher]
name = "/dev/shm/opd-bench/models-full/math-teacher"
base_url = ["http://localhost:8001/v1"]

[[orchestrator.train.source]]
name = "code"
ratio = 1.0

[orchestrator.train.source.env.taskset]
id = "mopd-prompts-v1"
data_path = "/dev/shm/opd-bench/data-full/prime_code_train.jsonl"

[orchestrator.train.source.env.agent.harness]
id = "null"

[orchestrator.train.source.env.agent.runtime]
type = "subprocess"

[orchestrator.train.source.algo]
type = "opd"

[orchestrator.train.source.algo.teacher]
name = "/dev/shm/opd-bench/models-full/code-teacher"
base_url = ["http://localhost:8002/v1"]

[trainer.optim]
lr = 1e-6
weight_decay = 0.1
max_norm = 1.0
betas1 = 0.9
betas2 = 0.98

[trainer.model]
seq_len = 17408
attn = "flash_attention_2"
optimization_dtype = "bfloat16"
reduce_dtype = "bfloat16"

[weight_broadcast]
type = "filesystem"

[inference]
gpu_memory_utilization = 0.70
seed = 42

[inference.parallel]
dp = 4

[inference.model]
max_model_len = 17408
