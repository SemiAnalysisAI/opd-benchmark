max_steps = 15
seq_len = 1536

[model]
name = "/root/opd-bench/mopd/models/student"

[file_monitor]

[orchestrator]
batch_size = 64
group_size = 4

# Both train sources override this fallback with specialist OPD teachers.
[orchestrator.algo]
type = "grpo"

[orchestrator.renderer]
name = "default"

[orchestrator.train.sampling]
temperature = 1.0
max_completion_tokens = 256

[[orchestrator.train.source]]
name = "math"
ratio = 1.0

[orchestrator.train.source.env.taskset]
id = "mopd-prompts-v1"
data_path = "/root/opd-bench/mopd/data/prime_math_train.jsonl"

[orchestrator.train.source.env.agent.harness]
id = "null"

[orchestrator.train.source.env.agent.runtime]
type = "subprocess"

[orchestrator.train.source.algo]
type = "opd"

[orchestrator.train.source.algo.teacher]
name = "/root/opd-bench/mopd/models/math-teacher"
base_url = ["http://localhost:8001/v1"]

[[orchestrator.train.source]]
name = "code"
ratio = 1.0

[orchestrator.train.source.env.taskset]
id = "mopd-prompts-v1"
data_path = "/root/opd-bench/mopd/data/prime_code_train.jsonl"

[orchestrator.train.source.env.agent.harness]
id = "null"

[orchestrator.train.source.env.agent.runtime]
type = "subprocess"

[orchestrator.train.source.algo]
type = "opd"

[orchestrator.train.source.algo.teacher]
name = "/root/opd-bench/mopd/models/code-teacher"
base_url = ["http://localhost:8002/v1"]

[trainer.optim]
lr = 1e-6
weight_decay = 0.1
max_norm = 1.0
betas1 = 0.9
betas2 = 0.98

[trainer.model]
attn = "flash_attention_2"
optimization_dtype = "bfloat16"
reduce_dtype = "bfloat16"

[weight_broadcast]
type = "filesystem"

[inference]
gpu_memory_utilization = 0.35
seed = 42
